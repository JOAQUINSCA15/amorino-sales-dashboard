    ${renderDailySeriesCard(shop, from, to)}
    <div class="section-title"><span class="swatch" style="background:var(--raspberry)"></span>Ventas por hora</div>
    <div class="grid-2">
      ${renderHourlyCard(shop, from, to)}
      ${renderPaymentCard(shop, from, to)}
    </div>
    <div class="section-title"><span class="swatch" style="background:var(--pistachio)"></span>Equipo y sabores</div>
    <div class="grid-2">
      ${renderEmployeesCard(shop, from, to)}
      ${renderFlavorsCard(shop, from, to)}
    </div>
    <div class="section-title"><span class="swatch" style="background:var(--mango)"></span>Últimos tickets</div>
    ${renderUltimosCard(shop, from, to)}
  `;
  document.getElementById('content').innerHTML = html;
  attachSortHandler();
  fetchWeatherIfNeeded(from, to);
  if (!isRange) fetchRadiografiaIfNeeded(from, true); // true = also update panel KPI
  if (!isRange) loadDegustacionesIfNeeded();
}

/* ---- Evolución diaria (serie temporal) ---- */
function renderDailySeriesCard(shop, from, to){
  if (!from || !to) return `<div class="card"><div class="empty-note">Sin fechas seleccionadas</div></div>`;

  const days = [];
  let d = from;
  while (d <= to) { days.push(d); d = shiftDate(d, 1); }

  if (days.length < 2){
    return `<div class="card">
      <div class="hint">${shop==='all'?'Todas las tiendas':esc(shop)} · ${rangeLabel(from,to)}</div>
      <div class="empty-note">Selecciona un rango de varios días para ver la evolución.</div>
    </div>`;
  }

  const rows = t1ForRange(from, to, shop);
  const byDay = new Map();
  days.forEach(dd => byDay.set(dd, 0));
  rows.forEach(r => { if (!isNaN(r.ventas)) byDay.set(r.dkey, (byDay.get(r.dkey) || 0) + r.ventas); });
  const values = days.map(dd => byDay.get(dd) || 0);

  // Previous year: same calendar dates, -1 year, from Google Sheet only
  const prevValues = days.map(dd => getPrevYearTotalForShop(dd, shop));
  const hasPrev = prevValues.some(v => !isNaN(v));

  const allVals = values.concat(prevValues.filter(v => !isNaN(v)));
  const max = Math.max(...allVals, 1);
  const W = 760, H = 260, padL = 14, padR = 14, padT = 18, padB = 50;
  const innerW = W - padL - padR, innerH = H - padT - padB;
  const stepX = days.length > 1 ? innerW / (days.length - 1) : 0;
  const toY = v => padT + innerH - (isNaN(v) || !max ? 0 : (v / max) * innerH);

  const pts = values.map((v, i) => [padL + i * stepX, toY(v)]);
  const prevPts = prevValues.map((v, i) => [padL + i * stepX, isNaN(v) ? null : toY(v)]);

  const linePath = pts.map((p, i) => (i === 0 ? 'M' : 'L') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
  const baseline = (padT + innerH).toFixed(1);
  const areaPath = linePath + ` L${pts[pts.length-1][0].toFixed(1)},${baseline} L${pts[0][0].toFixed(1)},${baseline} Z`;

  let prevPath = '';
  prevPts.forEach((p, i) => {
    if (p[1] === null) return;
    const pp = prevPts[i-1];
    prevPath += (i === 0 || pp === null || pp[1] === null ? 'M' : 'L') + p[0].toFixed(1) + ',' + p[1].toFixed(1) + ' ';
  });

  const labelEvery = days.length <= 8 ? 1 : Math.ceil(days.length / 8);
  const dots = pts.map((p, i) => `<circle class="series-dot" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.5" fill="#C84B5E" stroke="#FFF" stroke-width="1.5"><title>${dateLabel(days[i])}: ${fmtEUR(values[i])}</title></circle>`).join('');
  const prevDots = hasPrev ? prevPts.map((p, i) => p[1] === null ? '' :
    `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.5" fill="#5E6FA3" stroke="#FFF" stroke-width="1"><title>${dateLabel(prevYearKey(days[i]))}: ${fmtEUR(prevValues[i])}</title></circle>`
  ).join('') : '';
  const xLabels = pts.map((p, i) => (i % labelEvery === 0 || i === pts.length - 1)
    ? `<text x="${p[0].toFixed(1)}" y="${H - 28}" font-size="10" fill="#766955" text-anchor="middle">${dateLabel(days[i]).slice(0, 5)}</text>`
    : '').join('');

  const total = values.reduce((a,b)=>a+b,0);
  const avg = total / values.length;
  const best = Math.max(...values);
  const bestDay = days[values.indexOf(best)];

  const legend = `<g transform="translate(${padL}, ${H - 16})">
    <line x1="0" y1="-4" x2="18" y2="-4" stroke="#C84B5E" stroke-width="2.5"/>
    <circle cx="9" cy="-4" r="3" fill="#C84B5E"/>
    <text x="22" y="0" font-size="11" fill="#766955">Este año</text>
    ${hasPrev ? `<line x1="80" y1="-4" x2="98" y2="-4" stroke="#5E6FA3" stroke-width="1.8" stroke-dasharray="4 3"/>
    <circle cx="89" cy="-4" r="2.5" fill="#5E6FA3"/>
    <text x="102" y="0" font-size="11" fill="#766955">Año anterior</text>` : ''}
  </g>`;

  return `<div class="card">
    <div class="hint">${shop==='all'?'Todas las tiendas':esc(shop)} · ${rangeLabel(from,to)} · media diaria ${fmtEUR(avg)} · mejor día ${dateLabel(bestDay)} (${fmtEUR(best)})</div>
    <svg viewBox="0 0 ${W} ${H}" class="series-svg" preserveAspectRatio="none">
      <defs>
        <linearGradient id="seriesFill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#C84B5E" stop-opacity="0.22"/>
          <stop offset="100%" stop-color="#C84B5E" stop-opacity="0.02"/>
        </linearGradient>
      </defs>
      <path d="${areaPath}" fill="url(#seriesFill)" stroke="none"/>
      ${hasPrev && prevPath ? `<path d="${prevPath.trim()}" fill="none" stroke="#5E6FA3" stroke-width="1.8" stroke-dasharray="5 3" stroke-linejoin="round" stroke-linecap="round" opacity="0.8"/>` : ''}
      <path d="${linePath}" fill="none" stroke="#C84B5E" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      ${hasPrev ? prevDots : ''}
      ${dots}
      ${xLabels}
      ${legend}
    </svg>
  </div>`;
}

/* ---- KPIs ---- */
function renderKPIs(shop, from, to){
  if (!from || !to) return `<div class="banner">No hay fechas seleccionadas todavía.</div>`;
  const inScope = r => inRange(r.dkey, from, to) && (shop === 'all' || shopEq(r.shop, shop));
  const t1rows = t1ForRange(from, to, shop);
  const t2rows = t2ForRange(from, to, shop);
  const t3rows = State.raw.t3.filter(inScope);

  const ventasPeriodo = sum(t1rows.map(r => r.ventas));
  const ticketsTotal = sum(t2rows.map(r => r.ticketsTotal));
  const litros = sum(t2rows.map(r => r.litrosDia));
  const ticketMedio = ticketsTotal ? ventasPeriodo / ticketsTotal : NaN;
  const sgTotal = sum(t3rows.map(r => r.sugerencias));
  const ticketsConT3 = sum(t3rows.map(r => r.tickets));
  const sugPctT3 = ticketsConT3 ? (sgTotal / ticketsConT3) * 100 : NaN;

  // Use t2 for shop-level sugerencias and media de helado (authoritative source)
  // Weighted average by ticketsTotal across shops/days
  const t2TicketsTotal = sum(t2rows.map(r => r.ticketsTotal));
  const sugPct = t2TicketsTotal
    ? t2rows.filter(r => !isNaN(r.sugerenciasPct) && !isNaN(r.ticketsTotal))
        .reduce((a,r) => a + r.sugerenciasPct * r.ticketsTotal, 0) / t2TicketsTotal
    : sugPctT3; // fallback to t3 if t2 unavailable
  const medHelKPI = t2TicketsTotal
    ? t2rows.filter(r => !isNaN(r.ticketMedioGelato) && !isNaN(r.ticketsTotal))
        .reduce((a,r) => a + r.ticketMedioGelato * r.ticketsTotal, 0) / t2TicketsTotal
    : NaN;

  // "Var. mes vs año anterior": compute from t1 + historical to avoid gaps in Table 2
  let difPct = NaN;
  {
    const mStart = monthStart(to);
    const inScopeMonth = r => inRange(r.dkey, mStart, to) && (shop === 'all' || shopEq(r.shop, shop));
    const mesActual = sum(t1ForRange(mStart, to, shop).map(r => r.ventas));
    const mDays = []; let dd = mStart; while(dd <= to){ mDays.push(dd); dd = shiftDate(dd,1); }
    const prevMesTotal = mDays.map(d => getPrevYearTotalForShop(d, shop)).filter(v => !isNaN(v));
    const mesAnt = prevMesTotal.length ? prevMesTotal.reduce((a,b)=>a+b,0) : NaN;
    difPct = (!isNaN(mesActual) && !isNaN(mesAnt) && mesAnt > 0)
      ? ((mesActual - mesAnt) / mesAnt) * 100 : NaN;
  }

  const isRange = from !== to;
  // Days with data vs total days in range
  const totalDays = (() => { let n=0, d=from; while(d<=to){ n++; d=shiftDate(d,1); } return n; })();
  const daysWithData = (() => {
    const have = new Set(t1rows.filter(r => !isNaN(r.ventas) && r.ventas > 0).map(r => r.dkey));
    return have.size;
  })();
  const SHOP_ABBR = {
    'Amorino Sevilla Avenida':       'Ave',
    'Amorino Patio de los Naranjos': 'Nar',
    'Amorino Catedral':              'Cat',
    'Amorino Plaza Nueva':           'PN',
    'Amorino Alcázar':               'Alc',
  };
  const shopsToCheck = shop === 'all' ? SHOP_ORDER : [shop];

  let coverageNote;
  if (isRange){
    if (shop === 'all'){
      const perShop = shopsToCheck.map(s => {
        const n = new Set((State.t1ByDkey ? [] : []).concat(
          (() => { const res=[]; let d=from; while(d<=to){for(const r of(State.t1ByDkey[d]||[])){if(shopEq(r.shop,s)&&!isNaN(r.ventas)&&r.ventas>0)res.push(d);} d=shiftDate(d,1);} return res; })()
        )).size;
        const abbr = SHOP_ABBR[s] || s.replace('Amorino ','');
        return `${abbr} ${n}/${totalDays}`;
      });
      coverageNote = `${daysWithData}/${totalDays} días · ` + perShop.join(' · ');
    } else {
      coverageNote = `${daysWithData}/${totalDays} días con datos`;
    }
  } else {
    // Single day
    if (shop === 'all'){
      const statuses = shopsToCheck.map(s => {
        const has = (State.t1ByDkey[from]||[]).some(r => shopEq(r.shop,s) && !isNaN(r.ventas) && r.ventas > 0);
        return `${SHOP_ABBR[s]||s} ${has ? '✓' : '✗'}`;
      });
      coverageNote = statuses.join(' · ');
    } else {
      const has = (State.t1ByDkey[from]||[]).some(r => shopEq(r.shop,shop) && !isNaN(r.ventas) && r.ventas > 0);
      coverageNote = has ? 'Con datos ✓' : 'Sin datos ✗';
    }
  }

  // Trayectoria: (ventas / daysWithData) × days_in_month
  const avgDaily = daysWithData > 0 ? ventasPeriodo / daysWithData : NaN;
  const monthDays = (() => {
    if (!isRange) return null;
    const [fy, fm] = from.split('-').map(Number);
    const [ty, tm] = to.split('-').map(Number);
    if (fy === ty && fm === tm) return new Date(fy, fm, 0).getDate(); // same month
    return 30; // cross-month: use 30
  })();
  const trayectoria = (!isNaN(avgDaily) && monthDays) ? avgDaily * monthDays : NaN;
  const trayectoriaNote = !isNaN(trayectoria) ? `Proyección mes (${monthDays}d): ${fmtEUR(trayectoria)}` : null;

  const cards = [
    { label: isRange ? 'Ventas del periodo' : 'Ventas del día', value:fmtEUR(ventasPeriodo), color:'var(--raspberry)', note: coverageNote, note2: trayectoriaNote },
    { label:'Tickets totales', value:fmtInt(ticketsTotal), color:'var(--mango)' },
    { label:'Ticket medio', value:fmtEUR(ticketMedio), color:'var(--pistachio)' },
    { label:'Litros de helado', value:fmtNum(litros,1)+' Lt.', color:'var(--blueberry)' },
    { label:'Media de helado', value:fmtEUR(medHelKPI), color:'var(--pistachio)' },
    { label:'% Sugerencias/ticket', value:fmtPct(sugPct), color:'var(--cocoa)' },
    { label:'Var. mes vs año anterior', value:fmtPct(difPct), color: (difPct>=0?'#4D7A3F':'var(--raspberry)'), note: isRange ? ('a '+dateLabel(to)) : null },
  ];

  // True period-vs-period YoY: sum same calendar dates last year
  const prevDays = [];
  { let dp = from; while(dp <= to){ prevDays.push(dp); dp = shiftDate(dp,1); } }
  const prevValues = prevDays.map(dp => getPrevYearTotalForShop(dp, shop));
  const validPrev = prevValues.filter(v => !isNaN(v));
  const ventasPrevPeriodo = validPrev.length ? validPrev.reduce((a,b)=>a+b,0) : NaN;
  const yoyPct = (!isNaN(ventasPeriodo) && !isNaN(ventasPrevPeriodo) && ventasPrevPeriodo > 0)
    ? ((ventasPeriodo - ventasPrevPeriodo) / ventasPrevPeriodo) * 100 : NaN;
  const yoyColor = isNaN(yoyPct) ? 'var(--blueberry)' : (yoyPct >= 0 ? '#4D7A3F' : 'var(--raspberry)');
  const yoyCards = [
    { label: isRange ? 'Mismo periodo año anterior' : 'Mismo día año anterior',
      value: fmtEUR(ventasPrevPeriodo),
      color: '#5E6FA3',
      note: validPrev.length < prevDays.length ? `${validPrev.length}/${prevDays.length} días con datos` : null },
    { label: 'Variación interanual', value: fmtPct(yoyPct), color: yoyColor },
  ];

  // Update print header meta
  const metaEl = document.getElementById('printMeta');
  if (metaEl){
    const shopLabel = shop === 'all' ? 'Todas las tiendas' : shop.replace('Amorino ','');
    metaEl.textContent = `${shopLabel} · ${rangeLabel(from, to)} · Generado el ${new Date().toLocaleDateString('es-ES', {day:'2-digit',month:'long',year:'numeric'})}`;
  }

  return `<div class="kpi-section-label">${isRange ? 'Rendimiento del periodo' : 'Rendimiento del día'}</div>
  <div class="kpi-row">${cards.map(c => `
    <div class="kpi">
      <div class="kpi-scoop" style="background:${c.color}"></div>
      <div class="kpi-body">
        <div class="kpi-label">${esc(c.label)}</div>
        <div class="kpi-value ${c.value.length>8?'small':''}">${c.value}</div>
        ${c.note ? `<div class="kpi-sub">${esc(c.note)}</div>` : ''}
        ${c.note2 ? `<div class="kpi-sub" style="margin-top:2px;color:var(--blueberry);font-weight:700;">${esc(c.note2)}</div>` : ''}
      </div>
    </div>`).join('')}</div>
  <div class="kpi-section-label" style="margin-top:18px;">Comparación interanual · mismo periodo</div>
  <div class="kpi-row" style="grid-template-columns:repeat(2,1fr);max-width:420px;">${yoyCards.map(c => `
    <div class="kpi">
      <div class="kpi-scoop" style="background:${c.color}"></div>
      <div class="kpi-body">
        <div class="kpi-label">${esc(c.label)}</div>
        <div class="kpi-value ${c.value.length>8?'small':''}">${c.value}</div>
        ${c.note ? `<div class="kpi-sub">${esc(c.note)}</div>` : ''}
      </div>
    </div>`).join('')}</div>
  <div class="kpi-section-label" style="margin-top:18px;">Comparación interanual · % sugerencias</div>
  ${(() => {
    const prevSug = getPrevYearSugForShop(from, to, shop);
    const sugDiff = (!isNaN(sugPct) && !isNaN(prevSug)) ? sugPct - prevSug : NaN;
    const sugColor = isNaN(sugDiff) ? 'var(--blueberry)' : (sugDiff >= 0 ? '#4D7A3F' : 'var(--raspberry)');
    const sugCards = [
      { label: isRange ? 'Sugerencias mismo periodo año ant.' : 'Sugerencias mismo día año ant.',
        value: fmtPct(prevSug), color: '#5E6FA3' },
      { label: 'Variación interanual (pp)',
        value: isNaN(sugDiff) ? '—' : (sugDiff >= 0 ? '+' : '') + fmtNum(sugDiff, 1) + ' pp',
        color: sugColor },
    ];
    return `<div class="kpi-row" style="grid-template-columns:repeat(2,1fr);max-width:420px;">${sugCards.map(c => `
      <div class="kpi">
        <div class="kpi-scoop" style="background:${c.color}"></div>
        <div class="kpi-body">
          <div class="kpi-label">${esc(c.label)}</div>
          <div class="kpi-value small">${c.value}</div>
        </div>
      </div>`).join('')}</div>`;
  })()}
  <div class="kpi-section-label" style="margin-top:18px;">Comparación interanual · media de helado</div>
  ${(() => {
    const mhComp = getMatchedMedHelComparison(from, to, shop);
    const medHelDiff = (!isNaN(mhComp.current) && !isNaN(mhComp.previous)) ? mhComp.current - mhComp.previous : NaN;
    const medHelColor = isNaN(medHelDiff) ? 'var(--blueberry)' : (medHelDiff >= 0 ? '#4D7A3F' : 'var(--raspberry)');
    const matchNote = mhComp.matchedDays < mhComp.totalDays && mhComp.matchedDays > 0
      ? `${mhComp.matchedDays}/${mhComp.totalDays} días comparables` : null;
    const medHelCards = [
      { label: isRange ? 'Med. helado mismo periodo año ant.' : 'Med. helado mismo día año ant.',
        value: fmtEUR(mhComp.previous), color: '#5E6FA3',
        note: isNaN(mhComp.previous) ? 'Sin datos históricos para este periodo' : matchNote },
      { label: 'Variación interanual',
        value: isNaN(medHelDiff) ? '—' : (medHelDiff >= 0 ? '+' : '') + fmtNum(medHelDiff, 2) + ' €',
        color: medHelColor, note: matchNote && !isNaN(mhComp.previous) ? null : null },
    ];
    return `<div class="kpi-row" style="grid-template-columns:repeat(2,1fr);max-width:420px;">${medHelCards.map(c => `
      <div class="kpi">
        <div class="kpi-scoop" style="background:${c.color}"></div>
        <div class="kpi-body">
          <div class="kpi-label">${esc(c.label)}</div>
          <div class="kpi-value small">${c.value}</div>
          ${c.note ? `<div class="kpi-sub">${esc(c.note)}</div>` : ''}
        </div>
      </div>`).join('')}</div>`;
  })()}
  ${(() => {
    const costeHora = State.costeBruto * (1 + State.seguridadSocial / 100);
    const shopsToCalc = shop === 'all' ? SHOP_ORDER : [shop];
    const days = []; let dd = from; while(dd <= to){ days.push(dd); dd = shiftDate(dd,1); }

    let totalCost = 0, totalVentas = 0, hasRad = false;
    for (const dd of days){
      const tabName = getRadiografiaTab(dd);
      const radData = tabName ? State.radiografia[tabName] : null;
      if (!radData) continue;
      const parts = dd.split('-').map(Number);
      const jsDay = new Date(parts[0], parts[1]-1, parts[2]).getDay();
      for (const shopFull of shopsToCalc){
        const shopKey = SHOP_RAD_KEY[shopFull]; if(!shopKey) continue;
        const h = calcPersonnelCostForShop(shopKey, jsDay, radData);
        if (!isNaN(h)){ totalCost += h * costeHora; hasRad = true; }
        const rows = (State.raw.t1||[]).filter(r => r.dkey === dd && shopEq(r.shop, shopFull));
        totalVentas += rows.reduce((a,r)=>a+(isNaN(r.ventas)?0:r.ventas),0);
      }
    }
    const ventasNetas = totalVentas / 1.1;
    const ratio = (hasRad && ventasNetas > 0) ? (totalCost / ventasNetas) * 100 : NaN;
    const shopLabel = shop === 'all' ? 'Total 5 tiendas' : shop.replace('Amorino ','');
    return `<div class="kpi-section-label" style="margin-top:18px;">Coste de personal (teórico)</div>
    <div class="kpi-row" style="grid-template-columns:repeat(1,1fr);max-width:210px;">
      <div class="kpi">
        <div class="kpi-scoop" style="background:var(--cocoa)"></div>
        <div class="kpi-body">
          <div class="kpi-label">${esc(shopLabel)} · ${fmtNum(costeHora,2)} €/h</div>
          <div id="costePersonalKPI">${isNaN(ratio) ? '<div class="kpi-value small">—</div>' : `<div class="kpi-value small">${fmtNum(ratio,1)} %</div>`}</div>
          ${isRange && !hasRad ? `<div class="kpi-sub">Cargando radiografías…</div>` : ''}
          ${isRange && hasRad && days.length > 1 ? `<div class="kpi-sub">${days.filter(dd=>{const t=getRadiografiaTab(dd);return t&&State.radiografia[t];}).length}/${days.length} días con rad.</div>` : ''}
        </div>
      </div>
    </div>`;
  })()}`;
}
function sum(arr){ const v = arr.filter(n => !isNaN(n)); return v.length ? v.reduce((a,b)=>a+b,0) : NaN; }

/* ---- Hourly chart ---- */
function renderHourlyCard(shop, from, to){
  if (!from || !to) return `<div class="card"><div class="empty-note">Sin fechas seleccionadas</div></div>`;
  const rows = t1ForRange(from, to, shop);
  if (!rows.length) return `<div class="card"><h3>Ventas por hora</h3><div class="empty-note">Sin datos para esta selección</div></div>`;
  const map = new Map();
  rows.forEach(r => map.set(r.horario, (map.get(r.horario)||0) + (isNaN(r.ventas)?0:r.ventas)));
  const horas = Array.from(map.keys()).sort((a,b) => hourOrderKey(a) - hourOrderKey(b));
  const max = Math.max(...horas.map(h => map.get(h)), 1);
  const bars = horas.map(h => {
    const v = map.get(h);
    const pct = Math.max((v/max)*100, 2);
    return `<div class="hbar-col">
        <div class="hbar" style="height:${pct}%" title="${esc(h)}h · ${fmtEUR(v)}"></div>
        <div class="hbar-axis">${esc(h)}</div>
      </div>`;
  }).join('');
  return `<div class="card">
    <h3>Ventas por hora</h3>
    <div class="hint">${shop==='all'?'Todas las tiendas':esc(shop)} · ${rangeLabel(from,to)}${from!==to?' (suma del periodo)':''}</div>
    <div class="hbars">${bars}</div>
  </div>`;
}

/* ---- Payment donut ---- */
function renderPaymentCard(shop, from, to){
  if (!from || !to) return `<div class="card"><div class="empty-note">Sin fechas seleccionadas</div></div>`;
  const rows = State.raw.t6.filter(r => inRange(r.dkey, from, to) && (shop === 'all' || shopEq(r.shop, shop)));
  if (!rows.length) return `<div class="card"><h3>Formas de pago</h3><div class="empty-note">Sin datos para esta selección</div></div>`;
  const map = new Map();
  rows.forEach(r => map.set(r.forma, (map.get(r.forma)||0) + (isNaN(r.total)?0:r.total)));
  const entries = Array.from(map.entries()).sort((a,b) => b[1]-a[1]);
  const total = sum(entries.map(e => e[1])) || 1;
  let acc = 0;
  const stops = entries.map((e,i) => {
    const pct = (e[1]/total)*100;
    const pctFrom = acc; acc += pct;
    return `${FLAVOR_COLORS[i % FLAVOR_COLORS.length]} ${pctFrom}% ${acc}%`;
  }).join(', ');
  const legend = entries.map((e,i) => `
    <div class="legend-row">
      <span class="legend-sw" style="background:${FLAVOR_COLORS[i % FLAVOR_COLORS.length]}"></span>
      <span>${esc(e[0])}</span>
      <span class="pct" style="display:flex;flex-direction:column;align-items:flex-end;gap:1px;">
        <span>${fmtEUR(e[1])}</span>
        <span style="font-size:10.5px;color:var(--ink-soft);font-weight:400;">${fmtPct((e[1]/total)*100)}</span>
      </span>
    </div>`).join('');
  return `<div class="card">
    <h3>Formas de pago</h3>
    <div class="hint">${shop==='all'?'Todas las tiendas':esc(shop)} · ${rangeLabel(from,to)}</div>
    <div class="donut-wrap">
      <div style="position:relative;">
        <div class="donut" style="background:conic-gradient(${stops})"></div>
        <div class="donut-center"><div class="v">${fmtEUR(total)}</div><div class="l">Total</div></div>
      </div>
      <div class="legend">${legend}</div>
    </div>
  </div>`;
}

/* ---- Employees ---- */
let empSortKey = 'tickets';
let empSearch = '';    // compound key "shop||name" for trend chart
let empSearchText = ''; // free text for table filtering

function empKey(shop, emp){ return `${shop}||${emp}`; }
function empKeyShop(key){ return key.split('||')[0]; }
function empKeyName(key){ return key.split('||')[1]; }
function renderEmployeesCard(shop, from, to){
  if (!from || !to) return `<div class="card"><div class="empty-note">Sin fechas seleccionadas</div></div>`;
  const rows = State.raw.t3.filter(r => inRange(r.dkey, from, to) && (shop === 'all' || shopEq(r.shop, shop)) && r.empleado);
  if (!rows.length) return `<div class="card"><h3>Empleados</h3><div class="empty-note">Sin datos para esta selección</div></div>`;

  const groups = new Map();
  rows.forEach(r => {
    const key = `${r.shop}|${r.empleado}`;
    if (!groups.has(key)) groups.set(key, { shop:r.shop, empleado:r.empleado, dias:0, ticketsSum:0, sgSum:0, ticketMedioSum:0, ticketMedioN:0, medHelSum:0, medHelN:0 });
    const g = groups.get(key);
    g.dias += 1;
    if (!isNaN(r.tickets))    g.ticketsSum    += r.tickets;
    if (!isNaN(r.sugerencias)) g.sgSum         += r.sugerencias;
    if (!isNaN(r.ticketMedio)){ g.ticketMedioSum += r.ticketMedio; g.ticketMedioN += 1; }
    if (!isNaN(r.medHel) && !isNaN(r.tickets) && r.tickets > 0){
      g.medHelSum += r.medHel * r.tickets;
      g.medHelN   += r.tickets;
    }
  });
  const agg = Array.from(groups.values()).map(g => ({
    shop: g.shop, empleado: g.empleado, dias: g.dias,
    tickets:       g.ticketsSum,
    ticketMedio:   g.ticketMedioN ? g.ticketMedioSum / g.ticketMedioN : NaN,
    medHel:        g.medHelN      ? g.medHelSum      / g.medHelN      : NaN,
    sugerenciasPct: g.ticketsSum  ? (g.sgSum / g.ticketsSum) * 100    : NaN
  }));

  const sorted = agg.sort((a,b) => (b[empSortKey]||0) - (a[empSortKey]||0));
  const filtered = empSearchText
    ? sorted.filter(r => r.empleado.toLowerCase().includes(empSearchText.toLowerCase()))
    : sorted;
  const showShop = shop === 'all';
  const isRange = from !== to;

  // Employee trend chart
  let trendHtml = '';
  if (empSearch){
    const selShop = empKeyShop(empSearch);
    const selName = empKeyName(empSearch);
    const empRows = rows.filter(r => r.empleado === selName && shopEq(r.shop, selShop));
    if (empRows.length){
      const byDay = new Map();
      empRows.forEach(r => {
        if (!byDay.has(r.dkey)) byDay.set(r.dkey, {sg:0, tix:0});
        const d = byDay.get(r.dkey);
        if (!isNaN(r.sugerencias)) d.sg  += r.sugerencias;
        if (!isNaN(r.tickets))     d.tix += r.tickets;
      });
      const days = [...byDay.keys()].sort();
      const vals = days.map(d => { const e = byDay.get(d); return e.tix > 0 ? (e.sg/e.tix)*100 : NaN; });
      const tixByDay = days.map(d => byDay.get(d).tix);
      const sgByDay  = days.map(d => byDay.get(d).sg);
      const validVals = vals.filter(v => !isNaN(v));
      const avg = validVals.length ? validVals.reduce((a,b)=>a+b,0)/validVals.length : NaN;

      // Store for download
      State.empTrendExport = days.map((d,i) => ({
        fecha: dateLabel(d),
        tienda: selShop,
        tickets: tixByDay[i]||0,
        sugerencias: sgByDay[i]||0,
        pct: isNaN(vals[i]) ? '' : +vals[i].toFixed(2)
      }));
      if (validVals.length >= 1){
        const W=700, H=200, padL=38, padR=14, padT=14, padB=36;
        const innerW=W-padL-padR, innerH=H-padT-padB;
        const max=Math.max(...validVals, 25);
        const stepX = days.length>1 ? innerW/(days.length-1) : 0;
        const toY = v => isNaN(v)?null:padT+innerH-(v/max)*innerH;
        const pts = vals.map((v,i)=>[padL+i*stepX, toY(v)]);
        const path = pts.map((p,i)=>p[1]===null?'':(i===0||pts[i-1][1]===null?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
        const labelEvery = days.length<=10?1:Math.ceil(days.length/10);

        // 20% reference line y position
        const refY = toY(20);
        const avgY = !isNaN(avg) ? toY(avg) : null;

        const dots = pts.map((p,i)=>p[1]===null?'':`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.5"
          fill="${vals[i]>=20?'#4D7A3F':'#C84B5E'}" stroke="#fff" stroke-width="1.5">
          <title>${dateLabel(days[i])}: ${fmtPct(vals[i])} (${sgByDay[i]} sg / ${tixByDay[i]} tix)</title></circle>`).join('');
        const xLabels = pts.map((p,i)=>(i%labelEvery===0||i===pts.length-1)?
          `<text x="${p[0].toFixed(1)}" y="${H-8}" font-size="9" fill="#766955" text-anchor="middle">${dateLabel(days[i]).slice(0,5)}</text>`:''
        ).join('');

        // Y-axis labels
        const yTicks = [0, 10, 20, 30, 40, 50].filter(v => v <= max+5);
        const yAxisLabels = yTicks.map(v=>{
          const y = toY(v); if(y===null) return '';
          return `<line x1="${padL-4}" y1="${y.toFixed(1)}" x2="${padL}" y2="${y.toFixed(1)}" stroke="#ccc" stroke-width="1"/>
          <line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" stroke="#f0e8d8" stroke-width="0.5"/>
          <text x="${padL-6}" y="${(y+3).toFixed(1)}" font-size="9" fill="#999" text-anchor="end">${v}%</text>`;
        }).join('');

        trendHtml = `<div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--line);">
          <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:10px;">
            <div style="font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);">
              ${esc(selName)} · ${esc(selShop.replace('Amorino ',''))} · ${validVals.length} días · media ${fmtPct(avg)}
            </div>
            <div style="font-size:10px;color:var(--ink-soft);margin-top:2px;">Un punto = un día de trabajo · sugerencias ÷ tickets de ese día</div>
            <button onclick="downloadEmpTrend()"
              style="font-size:12px;font-weight:600;color:var(--cocoa);background:var(--cream-2);
              border:1px solid var(--line);border-radius:8px;padding:5px 12px;cursor:pointer;">⬇ Excel</button>
          </div>
          <svg viewBox="0 0 ${W} ${H}" style="width:100%;overflow:visible;">
            ${yAxisLabels}
            <!-- 20% reference line -->
            ${refY!==null?`<line x1="${padL}" y1="${refY.toFixed(1)}" x2="${W-padR}" y2="${refY.toFixed(1)}"
              stroke="#C84B5E" stroke-width="1.5" stroke-dasharray="6 3"/>
            <text x="${W-padR-2}" y="${(refY-4).toFixed(1)}" font-size="9" fill="#C84B5E" text-anchor="end">20%</text>`:''}
            <!-- Average line -->
            ${avgY!==null?`<line x1="${padL}" y1="${avgY.toFixed(1)}" x2="${W-padR}" y2="${avgY.toFixed(1)}"
              stroke="#5E6FA3" stroke-width="1" stroke-dasharray="3 3" opacity="0.6"/>
            <text x="${padL+4}" y="${(avgY-4).toFixed(1)}" font-size="9" fill="#5E6FA3">media</text>`:''}
            <path d="${path.trim()}" fill="none" stroke="#5E6FA3" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
            ${dots}${xLabels}
          </svg>
        </div>`;
      } else {
        trendHtml = `<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-soft);">Sin datos suficientes para mostrar la trayectoria.</div>`;
      }
    }
  }

  return `<div class="card">
    <h3>Rendimiento del equipo</h3>
    <div class="hint">${shop==='all'?'Todas las tiendas':esc(shop)} · ${rangeLabel(from,to)} · ${sorted.length} persona${sorted.length!==1?'s':''}</div>
    <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px;">
      <select class="sort-select" id="empSortSelect" style="margin-bottom:0;">
        <option value="tickets"       ${empSortKey==='tickets'?'selected':''}>Ordenar por Nº de tickets</option>
        <option value="ticketMedio"   ${empSortKey==='ticketMedio'?'selected':''}>Ordenar por ticket medio</option>
        <option value="medHel"        ${empSortKey==='medHel'?'selected':''}>Ordenar por media helado</option>
        <option value="sugerenciasPct"${empSortKey==='sugerenciasPct'?'selected':''}>Ordenar por % sugerencias</option>
      </select>
      <div style="display:flex;align-items:center;gap:6px;flex:1;min-width:160px;">
        <input id="empSearchInput" placeholder="Buscar empleado…" value="${esc(empSearchText)}"
          style="font-family:'Inter',sans-serif;font-size:13px;padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:var(--white);color:var(--ink);flex:1;">
        ${empSearchText ? `<button onclick="empSearch='';empSearchText='';renderAll();" style="font-size:11px;border:none;background:none;cursor:pointer;color:var(--ink-soft);">✕</button>` : ''}
      </div>
    </div>
    <div style="overflow-x:auto;">
    <table>
      <thead><tr>
        <th>Empleado${showShop?' / Tienda':''}</th>
        ${isRange?'<th class="num">Días</th>':''}
        <th class="num">Tickets</th>
        <th class="num">Ticket medio</th>
        <th class="num">Med. Hel.</th>
        <th class="num">% Sug.</th>
      </tr></thead>
      <tbody>
        ${filtered.map(r => {
          const sugClass = isNaN(r.sugerenciasPct)?'':(r.sugerenciasPct>=20?'cell-good':'cell-bad');
          const helClass = isNaN(r.medHel)?'':(r.medHel>=5.20?'cell-good':'cell-bad');
          const key = empKey(r.shop, r.empleado);
          const isSelected = key === empSearch;
          return `<tr style="${isSelected?'background:rgba(94,111,163,0.08);':''}" onclick="empSearch='${esc(key)}';renderAll();" class="emp-row">
            <td><div class="emp-name">${esc(r.empleado)}</div>${showShop?`<div class="shop-tag">${esc(r.shop.replace('Amorino ',''))}</div>`:''}</td>
            ${isRange?`<td class="num">${fmtInt(r.dias)}</td>`:''}
            <td class="num">${fmtInt(r.tickets)}</td>
            <td class="num">${fmtEUR(r.ticketMedio)}</td>
            <td class="num ${helClass}">${isNaN(r.medHel)?'—':fmtNum(r.medHel,2)+' €'}</td>
            <td class="num ${sugClass}">${fmtPct(r.sugerenciasPct)}</td>
          </tr>`;}).join('')}
      </tbody>
    </table>
    </div>
    ${trendHtml}
  </div>`;
}
function downloadEmpTrend(){
  if (!State.empTrendExport || !State.empTrendExport.length || typeof XLSX === 'undefined') return;
  const rows = [['Fecha','Tienda','Tickets del día','Sugerencias del día','% Sugerencias del día']]
    .concat(State.empTrendExport.map(r => [r.fecha, r.tienda, r.tickets, r.sugerencias, r.pct]));
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet(rows);
  XLSX.utils.book_append_sheet(wb, ws, 'Sugerencias');
  const emp = empSearch ? empKeyName(empSearch).replace(/[^a-zA-Z0-9]/g,'_') : 'empleado';
  XLSX.writeFile(wb, `${emp}_sugerencias_diarias.xlsx`);
}

function attachSortHandler(){
  const el = document.getElementById('empSortSelect');
  if (el) el.addEventListener('change', e => { empSortKey = e.target.value; renderAll(); });
  const si = document.getElementById('empSearchInput');
  if (si){
    // Live filter as user types
    si.addEventListener('input', e => {
      empSearchText = e.target.value.trim();
      // Clear trend if search text changed
      if (empSearch && empKeyName(empSearch).toLowerCase() !== empSearchText.toLowerCase()) empSearch = '';
      renderAll();
      // Restore focus and cursor position
      const inp = document.getElementById('empSearchInput');
      if (inp){ inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
    });
  }
}

function attachEvalHandlers(){
  // Per-shop productivity inputs
  document.querySelectorAll('.prod-shop-input').forEach(inp => {
    inp.addEventListener('change', e => {
      const v = parseFloat(e.target.value);
      const shopFull = e.target.dataset.shop;
      if (!isNaN(v) && v > 0 && shopFull) {
        State.productividadByShop[shopFull] = v;
        refreshEval();
      }
    });
  });
  // Hourly cost inputs (costeBruto + seguridadSocial)
  const costeBrutoEl = document.getElementById('costeBrutoInput');
  if (costeBrutoEl) costeBrutoEl.addEventListener('change', e => {
    const v = parseFloat(e.target.value);
    if (!isNaN(v) && v > 0) { State.costeBruto = v; refreshEval(); }
  });
  const ssEl = document.getElementById('ssInput');
  if (ssEl) ssEl.addEventListener('change', e => {
    const v = parseFloat(e.target.value);
    if (!isNaN(v) && v >= 0) { State.seguridadSocial = v; refreshEval(); }
  });
}
function refreshEval(){
  // Single-day mode
  const sec = document.getElementById('evalTurnoSection');
  if (sec) { sec.innerHTML = buildEvalTurnoHTML(State.shop, State.from); attachEvalHandlers(); return; }
  // Multi-day mode: refresh all day blocks
  document.querySelectorAll('[id^="evalDay-"]').forEach(el => {
    const dd = el.id.replace('evalDay-','');
    el.innerHTML = buildEvalDayContent(State.shop, dd);
  });
  // Refresh global controls cost display
  const ctrl = document.getElementById('costeBrutoInput');
  if (ctrl) ctrl.closest('.eval-global-controls').querySelector('.prod-control:last-of-type').textContent =
    `→ Total: ${fmtNum(State.costeBruto*(1+State.seguridadSocial/100),2)} €/h`;
  attachEvalHandlers();
}

/* ---- Flavors ---- */
function renderFlavorsCard(shop, from, to){
  if (!from || !to) return `<div class="card"><div class="empty-note">Sin fechas seleccionadas</div></div>`;
  const rows = State.raw.t5.filter(r => inRange(r.dkey, from, to) && (shop === 'all' || shopEq(r.shop, shop)) && r.sabor);
  if (!rows.length) return `<div class="card"><h3>Sabores más vendidos</h3><div class="empty-note">Sin datos para esta selección</div></div>`;
  const map = new Map();
  rows.forEach(r => map.set(r.sabor, (map.get(r.sabor)||0) + (isNaN(r.unidades)?0:r.unidades)));
  const top = Array.from(map.entries()).sort((a,b) => b[1]-a[1]).slice(0,10);
  const max = Math.max(...top.map(t => t[1]), 1);
  return `<div class="card">
    <h3>Sabores más vendidos</h3>
    <div class="hint">${shop==='all'?'Todas las tiendas':esc(shop)} · ${rangeLabel(from,to)}</div>
    <div class="rank-list">
      ${top.map((t,i) => `
        <div class="rank-row">
          <div class="rank-num">${i+1}</div>
          <div class="rank-item">
            <div class="rank-name">${esc(t[0])}</div>
            <div class="rank-bar-wrap"><div class="rank-bar" style="width:${(t[1]/max)*100}%"></div></div>
          </div>
          <div class="rank-val">${fmtInt(t[1])} ud.</div>
        </div>`).join('')}
    </div>
  </div>`;
}

/* ---- Ultimos ---- */
function latestUltRow(shop, from, to){
  const candidates = State.raw.ult.filter(r => shopEq(r.shop, shop) && inRange(r.dkey, from, to));
  if (!candidates.length) return null;
  return candidates.reduce((best, r) => (!best || r.dkey > best.dkey) ? r : best, null);
}
function renderUltimosCard(shop, from, to){
  if (!from || !to) return `<div class="card"><div class="empty-note">Sin fechas seleccionadas</div></div>`;
  const isRange = from !== to;
  if (shop !== 'all'){
    const row = latestUltRow(shop, from, to);
    if (!row || !row.tickets.length) return `<div class="card"><div class="empty-note">Sin datos para esta selección</div></div>`;
    return `<div class="card">
      <h3>${esc(shop)}</h3>
      <div class="hint">Horas de los últimos 10 tickets · ${dateLabel(row.dkey)}${isRange?' (fecha más reciente con datos dentro del rango)':''}</div>
      <div class="tape-list">
        ${row.tickets.map((t,i) => `<div class="ticket-row ${i===0?'latest':''}"><span class="t-idx">Ticket ${i+1}</span><span>${esc(t)}</span></div>`).join('')}
      </div>
    </div>`;
  }
  const cards = State.shops.map(s => {
    const row = latestUltRow(s, from, to);
    const tickets = row ? row.tickets.slice(0,5) : [];
    return `<div class="ticket-card">
      <h4>${esc(s.replace('Amorino ',''))}</h4>
      ${row ? `<div class="hint" style="margin-bottom:8px;">${dateLabel(row.dkey)}</div>` : ''}
      ${tickets.length ? tickets.map((t,i) => `<div class="ticket-row ${i===0?'latest':''}"><span class="t-idx">#${i+1}</span><span>${esc(t)}</span></div>`).join('') : '<div class="empty-note" style="padding:10px 0;">Sin datos</div>'}
    </div>`;
  }).join('');
  return `<div class="tickets-grid">${cards}</div>`;
}

/* ================= INIT ================= */
document.getElementById('mainTabBar').addEventListener('click', e => {
  const btn = e.target.closest('.main-tab[data-tab]');
  if (!btn) return;
  const tab = btn.dataset.tab;
  State.activeTab = tab;
  document.body.classList.toggle('eval-active', tab === 'eval');
  document.querySelectorAll('.main-tab[data-tab]').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  renderAll();
});

loadData();
setInterval(() => { if (!State.loading) loadData(); }, AUTO_REFRESH_MS);
</script>
